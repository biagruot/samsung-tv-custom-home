<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Quick Home</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="wp-midnight">
<!-- The tiles are plain markup so the screen paints before any script runs. -->
<main class="stage" id="stage">
  <header class="top">
    <div class="clock" id="clock"></div>
    <div class="date" id="date"></div>
  </header>

  <section class="row">
    <div class="tile tile-tv is-focused" data-open="tv">
      <span class="num">1</span>
      <svg class="icon" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="5" y="10" width="54" height="36" rx="6" fill="none" stroke="#fff" stroke-width="5"/>
        <path d="M22 55h20" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      </svg>
      <span class="label">Canali TV</span>
      <span class="sub" data-sub="tv">In diretta</span>
    </div>

    <div class="tile tile-stremio" data-open="stremio">
      <span class="num">2</span>
      <svg class="icon" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="14" y="14" width="36" height="36" rx="6" transform="rotate(45 32 32)" fill="#fff"/>
        <path d="M27 22.5l13 9.5-13 9.5z" fill="#4b33a8"/>
      </svg>
      <span class="label">Stremio</span>
      <span class="sub" data-sub="stremio"></span>
    </div>

    <div class="tile tile-youtube" data-open="youtube">
      <span class="num">3</span>
      <svg class="icon" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="4" y="13" width="56" height="38" rx="11" fill="#fff"/>
        <path d="M27 23l16 9-16 9z" fill="#d7261e"/>
      </svg>
      <span class="label">YouTube</span>
      <span class="sub" data-sub="youtube"></span>
    </div>

    <div class="tile tile-ytmusic" data-open="ytmusic">
      <span class="num">4</span>
      <svg class="icon" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="27" fill="#ff1a3c"/>
        <circle cx="32" cy="32" r="15" fill="none" stroke="#fff" stroke-width="3"/>
        <path d="M28 25l11 7-11 7z" fill="#fff"/>
      </svg>
      <span class="label">YouTube Music</span>
      <span class="sub" data-sub="ytmusic"></span>
    </div>
  </section>

  <!-- Scenes: each opens the YouTube app straight on a long video (data-video is its id). -->
  <section class="row scenes">
    <div class="scene scene-fire" data-video="mSX3OyW9Rao">
      <svg class="scene-icon" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M32 4c3 11 15 17 15 33a15 15 0 0 1-30 0c0-8 4-13 8-17 1 6 3 9 7 10-2-9-1-18 0-26z" fill="#ff8a3d"/>
        <path d="M32 34c2 5 7 7 7 13a7 7 0 0 1-14 0c0-4 3-7 4-9 0 3 2 4 3 4z" fill="#ffd166"/>
      </svg>
      <span class="scene-label">Camino</span>
      <span class="num">5</span>
    </div>

    <div class="scene scene-rain" data-video="x7SQaDTSrVg">
      <svg class="scene-icon" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M17 40a11 11 0 0 1 1-22 15 15 0 0 1 28 3 10 10 0 0 1 1 19z" fill="#b8c7e6"/>
        <path d="M22 47l-3 9M33 47l-3 9M44 47l-3 9" stroke="#6fb0ff" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <span class="scene-label">Pioggia</span>
      <span class="num">6</span>
    </div>

    <div class="scene scene-reef" data-video="zQ8caaUxIvY">
      <svg class="scene-icon" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M6 32c9-13 26-15 38-6l13-9v30l-13-9c-12 9-29 7-38-6z" fill="#3fc1c9"/>
        <circle cx="19" cy="30" r="3.5" fill="#0b0d12"/>
      </svg>
      <span class="scene-label">Acquario</span>
      <span class="num">7</span>
    </div>

    <div class="scene scene-sea" data-video="WHPEKLQID4U">
      <svg class="scene-icon" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M4 40c7-7 14-7 21 0s14 7 21 0 11-6 14-6v20H4z" fill="#2f86d6"/>
        <path d="M4 26c7-7 14-7 21 0s14 7 21 0 11-6 14-6" fill="none" stroke="#8fd0ff" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <span class="scene-label">Mare</span>
      <span class="num">8</span>
    </div>
  </section>

  <footer class="hint">
    <span>&#9664; &#9654; &#9650; &#9660; sposta</span>
    <span>OK apri</span>
    <span>1&ndash;8 diretto</span>
    <span><b class="key key-red"></b> Tutte le app</span>
    <span><b class="key key-green"></b> Sfondo</span>
    <span><b class="key key-yellow"></b> Suoni</span>
    <span><b class="key key-blue"></b> Home Samsung</span>
  </footer>
  <div class="toast" id="toast"></div>
</main>

<!-- All installed apps. Hidden until the red button opens it. -->
<section class="apps-screen" id="appsScreen">
  <header class="apps-head">
    <span>Tutte le app</span>
    <span class="apps-hint">&#9664; &#9654; &#9650; &#9660; sposta &nbsp;&middot;&nbsp; OK apri &nbsp;&middot;&nbsp; Indietro chiudi</span>
  </header>
  <div class="apps-grid" id="appsGrid"></div>
  <div class="apps-empty" id="appsEmpty"></div>
</section>

<!-- Does nothing on the TV; stands in for the TV's APIs when previewed on a PC. -->
<script src="tizen-mock.js"></script>
<script src="app.js"></script>
</body>
</html>
